name: 🧪  CI Build

on:
  # 每周一 03:00 UTC（北京时间 11:00）
  # reF1nd 的提交集中在周一至周五 10:00-18:00 CST，周一上午跑能覆盖上周五至周末的更新
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: "构建目标 | official-stable=官方稳定 / official-testing=官方测试 / ref1nd-stable=改版稳定 / ref1nd-testing=改版测试"
        required: true
        type: choice
        default: "ref1nd-testing"
        options:
          - official-stable
          - official-testing
          - ref1nd-stable
          - ref1nd-testing

      build:
        description: "Build type"
        required: true
        type: choice
        default: "Binary"
        options: [ Apps, Binary ]

      # ===== 基础档位 =====
      profile:
        description: "Base profile | lean=仅当前配置所需(保底) / standard=全部非naive / full=官方默认"
        required: true
        type: choice
        default: "lean"
        options: [ lean, standard, full ]

      # ===== 常用可选 tags（勾选即追加到 base 之上）=====
      with_naive:
        description: "with_naive_outbound | NaiveProxy 出站（需 Chromium toolchain，构建慢，矩阵扩到 6 项）"
        required: false
        type: boolean
        default: false
      with_cloudflared:
        description: "with_cloudflared | Cloudflare Tunnel inbound"
        required: false
        type: boolean
        default: false
      with_tailscale:
        description: "with_tailscale | Tailscale endpoint"
        required: false
        type: boolean
        default: false
      with_gvisor:
        description: "with_gvisor | gVisor 栈（tun stack=gvisor/mixed 需要）"
        required: false
        type: boolean
        default: false
      with_dhcp:
        description: "with_dhcp | DHCP DNS transport"
        required: false
        type: boolean
        default: false
      with_acme:
        description: "with_acme | ACME 证书签发"
        required: false
        type: boolean
        default: false

      # ===== 兜底：其余 tags 手填，逗号分隔 =====
      extra_tags:
        description: "其余 tags 逗号分隔：with_grpc,with_openvpn,with_openconnect,with_usbip,with_ccm,with_ocm,with_v2ray_api,with_embedded_tor"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target || 'ref1nd-testing' }}-${{ inputs.build || 'Binary' }}
  cancel-in-progress: true

env:
  # lean：仅当前 sing-box.json 实际用到的功能
  #   with_quic       DoQ / Hysteria / QUIC transport
  #   with_wireguard  WARP endpoint
  #   with_utls       VLESS Reality fingerprint
  #   with_clash_api  面板 API
  #   badlinkname + tfogo_checklinkname0  必须与 release/LDFLAGS 的 -checklinkname=0 配套
  LEAN_BUILD_TAGS: >-
    with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0
  # standard：lean + 全部非 naive 功能（不含 with_naive_outbound）
  STANDARD_BUILD_TAGS: >-
    with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: build
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      matrix_linux: ${{ steps.matrix.outputs.value }}
      use_naive: ${{ steps.opts.outputs.use_naive }}
      repo: ${{ steps.target.outputs.repo }}
      branch: ${{ steps.target.outputs.branch }}
      nightly: ${{ steps.target.outputs.nightly }}
      base_tags: ${{ steps.opts.outputs.base }}
      extra_tags: ${{ steps.opts.outputs.extra }}

    steps:
      - name: 🎯 Resolve target
        id: target
        run: |
          set -euo pipefail
          # schedule 事件下 inputs 全为空，使用默认值
          TARGET="${{ inputs.target || 'ref1nd-testing' }}"
          case "$TARGET" in
            official-stable)
              REPO="SagerNet/sing-box"; BRANCH="stable";              NIGHTLY=false ;;
            official-testing)
              REPO="SagerNet/sing-box"; BRANCH="testing";             NIGHTLY=true  ;;
            ref1nd-stable)
              REPO="reF1nd/sing-box";   BRANCH="reF1nd-stable";       NIGHTLY=false ;;
            ref1nd-testing)
              REPO="reF1nd/sing-box";   BRANCH="reF1nd-testing-next"; NIGHTLY=true  ;;
            *)
              echo "::error::unknown target '${TARGET}'"; exit 1 ;;
          esac
          echo "repo=${REPO}"       >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"   >> "$GITHUB_OUTPUT"
          echo "nightly=${NIGHTLY}" >> "$GITHUB_OUTPUT"
          echo "Target: ${REPO}@${BRANCH}  nightly=${NIGHTLY}"

      - name: 🔍 Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: 🔧 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 🧮 Calculate Version
        id: set_version
        run: |
          set -euo pipefail
          extra=()
          # nightly 由 target 决定：测试版走 nightly，稳定版走正式版号
          if [[ "${{ needs.calculate_version.outputs.nightly }}" == "true" ]]; then
            extra+=(--nightly)
          fi
          output="$(go run ./cmd/internal/read_tag --ci "${extra[@]}" 2>&1)"
          printf '%s\n' "$output"
          version=''
          while IFS= read -r line; do
            line="${line%$'\r'}"
            line="${line#"${line%%[![:space:]]*}"}"
            case "$line" in
              version=*)
                version="${line#version=}"
                ;;
            esac
          done <<< "$output"
          if [[ -z "$version" ]]; then
            echo "::error::Failed to parse version from read_tag output"
            echo "::group::Escaped read_tag output"
            printf '%s\n' "$output" | sed -n 'l'
            echo "::endgroup::"
            exit 1
          fi
          echo "Calculated version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 🧮 Resolve build options
        id: opts
        run: |
          set -euo pipefail

          # ---- base tags by profile ----
          PROFILE="${{ inputs.profile || 'lean' }}"
          case "$PROFILE" in
            lean)     BASE="$LEAN_BUILD_TAGS" ;;
            standard) BASE="$STANDARD_BUILD_TAGS" ;;
            full)     BASE="" ;;   # 留空，由各平台读取 release/DEFAULT_BUILD_TAGS*
            *) echo "::error::unknown profile"; exit 1 ;;
          esac

          EXTRA=""
          add() {
            local t="$1"
            [[ -z "$t" ]] && return 0
            case ",${EXTRA}," in
              *",${t},"*) ;;
              *) EXTRA="${EXTRA:+${EXTRA},}${t}" ;;
            esac
          }

          # ---- feature toggles ----
          if [[ "${{ inputs.with_naive }}"       == "true" ]]; then add with_naive_outbound; fi
          if [[ "${{ inputs.with_cloudflared }}" == "true" ]]; then add with_cloudflared;   fi
          if [[ "${{ inputs.with_tailscale }}"   == "true" ]]; then add with_tailscale;     fi
          if [[ "${{ inputs.with_acme }}"        == "true" ]]; then add with_acme;          fi
          if [[ "${{ inputs.with_gvisor }}"      == "true" ]]; then add with_gvisor;        fi
          if [[ "${{ inputs.with_dhcp }}"        == "true" ]]; then add with_dhcp;          fi

          # ---- extra tags ----
          RAW="${{ inputs.extra_tags }}"
          if [[ -n "$RAW" ]]; then
            IFS=',' read -ra arr <<< "$RAW"
            for t in "${arr[@]}"; do add "$(echo "$t" | xargs)"; done
          fi

          # naive 决定是否需要 Chromium toolchain
          ALL="${BASE}${BASE:+,}${EXTRA}"
          if [[ ",${ALL}," == *",with_naive_outbound,"* ]]; then
            echo "use_naive=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_naive=false" >> "$GITHUB_OUTPUT"
          fi

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "extra=${EXTRA}" >> "$GITHUB_OUTPUT"
          echo "Resolved base: ${BASE:-<platform default>}  extra: ${EXTRA:-<none>}"

      - name: 🧮 Calculate Linux matrix
        id: matrix
        run: |
          set -euo pipefail
          # OpenWrt 架构名映射（同一二进制按不同 Architecture 字段打包）
          OW_AMD64="x86_64"
          OW_ARM64="aarch64_cortex-a53 aarch64_cortex-a72 aarch64_cortex-a76 aarch64_generic"

          if [[ "${{ steps.opts.outputs.use_naive }}" == "true" ]]; then
            # naive 需要 CGO + Chromium toolchain，仅官方支持的 amd64/arm64
            value=$(cat <<EOF
          [
            {"os":"linux","arch":"amd64","variant":"purego","cgo":"0","naive":true},
            {"os":"linux","arch":"arm64","variant":"purego","cgo":"0","naive":true},
            {"os":"linux","arch":"amd64","variant":"glibc","cgo":"1","naive":true},
            {"os":"linux","arch":"arm64","variant":"glibc","cgo":"1","naive":true},
            {"os":"linux","arch":"amd64","variant":"musl","cgo":"1","naive":true,
             "debian":"amd64","rpm":"x86_64","pacman":"x86_64","openwrt":"${OW_AMD64}"},
            {"os":"linux","arch":"arm64","variant":"musl","cgo":"1","naive":true,
             "debian":"arm64","rpm":"aarch64","pacman":"aarch64","openwrt":"${OW_ARM64}"}
          ]
          EOF
          )
          else
            # 纯 Go 静态二进制：glibc / musl / OpenWrt 通吃
            value=$(cat <<EOF
          [
            {"os":"linux","arch":"amd64","variant":"static","cgo":"0","naive":false,
             "debian":"amd64","rpm":"x86_64","pacman":"x86_64","openwrt":"${OW_AMD64}"},
            {"os":"linux","arch":"arm64","variant":"static","cgo":"0","naive":false,
             "debian":"arm64","rpm":"aarch64","pacman":"aarch64","openwrt":"${OW_ARM64}"}
          ]
          EOF
          )
          fi
          value="$(printf '%s' "$value" | tr -d '\n' | sed 's/  */ /g')"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build_linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.variant }}
    if: inputs.build == 'Binary' || github.event_name == 'schedule'
    needs: calculate_version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: build
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.calculate_version.outputs.matrix_linux) }}

    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.calculate_version.outputs.repo }}
          ref: ${{ needs.calculate_version.outputs.branch }}

      - name: 🔧 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 📩 Clone cronet-go
        if: matrix.naive
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          # 跳过 /lib 目录（预编译产物），配合 blob:none 只拉必要对象
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: ✏️ Regenerate Debian keyring
        if: matrix.naive
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: 💾 Cache Chromium toolchain
        if: matrix.naive
        id: cache-chromium-toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-${{ matrix.arch }}-${{ matrix.variant }}-${{ hashFiles('.github/CRONET_GO_VERSION') }}

      - name: 📥 Download Chromium toolchain
        if: matrix.naive
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.arch }} download-toolchain
          fi

      - name: 🗄️ Set Chromium toolchain environment
        if: matrix.naive
        run: |
          set -euo pipefail
          cd ~/cronet-go
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> $GITHUB_ENV
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.arch }} env >> $GITHUB_ENV
          fi

      - name: 🔧 Set build tags
        run: |
          set -euo pipefail
          TAGS="${{ needs.calculate_version.outputs.base_tags }}"
          if [[ -z "${TAGS}" ]]; then
            if [[ "${{ matrix.naive }}" == "true" ]]; then
              TAGS=$(cat release/DEFAULT_BUILD_TAGS)
            else
              TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
            fi
          fi
          EXTRA="${{ needs.calculate_version.outputs.extra_tags }}"
          if [[ -n "${EXTRA}" ]]; then
            IFS=',' read -ra ex <<< "$EXTRA"
            for t in "${ex[@]}"; do
              case ",${TAGS}," in *",${t},"*) ;; *) TAGS="${TAGS:+${TAGS},}${t}" ;; esac
            done
          fi
          if [[ "${{ matrix.variant }}" == "purego" ]]; then
            TAGS="${TAGS},with_purego"
          elif [[ "${{ matrix.variant }}" == "musl" ]]; then
            TAGS="${TAGS},with_musl"
          fi
          echo "BUILD_TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "Build tags: ${TAGS}"

      - name: 🔧 Set shared ldflags
        run: |
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: 🔨 Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "$BUILD_TAGS" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" \
          ./cmd/sing-box
          file dist/sing-box
          # 可复现构建：固定 mtime，使同一 commit 产物哈希稳定
          TZ=UTC touch -t '197001010000' dist/sing-box

      - name: 🧩 Extract libcronet.so
        if: matrix.naive && matrix.variant == 'purego'
        env:
          CGO_ENABLED: "0"
        run: |
          cd ~/cronet-go
          go run -v ./cmd/build-naive extract-lib --target ${{ matrix.os }}/${{ matrix.arch }} -o "$GITHUB_WORKSPACE/dist"

      - name: 🔧 Set name
        run: |
          set -euo pipefail
          ARCH_SUFFIX="${{ matrix.arch }}"
          if [[ -n "${{ matrix.goarm }}" ]]; then ARCH_SUFFIX="${ARCH_SUFFIX}v${{ matrix.goarm }}"; fi
          echo "ARCH_SUFFIX=${ARCH_SUFFIX}" >> "$GITHUB_ENV"
          DIR_NAME="sing-box_${{ needs.calculate_version.outputs.version }}_${{ matrix.os }}_${ARCH_SUFFIX}_${{ matrix.variant }}"
          ARTIFACT_NAME="binary_${{ matrix.os }}_${ARCH_SUFFIX}_${{ matrix.variant }}"
          PKG_VERSION="${{ needs.calculate_version.outputs.version }}"
          PKG_VERSION="${PKG_VERSION//-/\~}"
          echo "DIR_NAME=${DIR_NAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"

      - name: 📦 Install packaging tools
        if: matrix.debian || matrix.rpm || matrix.pacman || matrix.openwrt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debsigs libarchive-tools
          sudo gem install fpm

      - name: 📦 Package DEB
        if: matrix.debian
        run: |
          set -euo pipefail
          cp .fpm_systemd .fpm
          fpm -t deb \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ needs.calculate_version.outputs.version }}_${ARCH_SUFFIX}_${{ matrix.debian }}.deb" \
            --architecture ${{ matrix.debian }} \
            dist/sing-box=/usr/bin/sing-box

      - name: 📦 Package RPM
        if: matrix.rpm
        run: |
          set -euo pipefail
          cp .fpm_systemd .fpm
          fpm -t rpm \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ needs.calculate_version.outputs.version }}_${ARCH_SUFFIX}_${{ matrix.rpm }}.rpm" \
            --architecture ${{ matrix.rpm }} \
            dist/sing-box=/usr/bin/sing-box

      - name: 📦 Package Pacman
        if: matrix.pacman
        run: |
          set -euo pipefail
          cp .fpm_pacman .fpm
          fpm -t pacman \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ needs.calculate_version.outputs.version }}_${ARCH_SUFFIX}_${{ matrix.pacman }}.pkg.tar.zst" \
            --architecture ${{ matrix.pacman }} \
            dist/sing-box=/usr/bin/sing-box

      - name: 📦 Package OpenWrt
        if: matrix.openwrt
        run: |
          set -euo pipefail
          cp .fpm_openwrt .fpm
          fpm -t deb \
            -v "$PKG_VERSION" \
            -p "dist/openwrt.deb" \
            --architecture all \
            dist/sing-box=/usr/bin/sing-box
          for architecture in ${{ matrix.openwrt }}; do
            .github/deb2ipk.sh "$architecture" "dist/openwrt.deb" "dist/sing-box_${{ needs.calculate_version.outputs.version }}_openwrt_${architecture}.ipk"
          done

      - name: 🗜️ Archive
        run: |
          set -euo pipefail
          cd dist && mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME"
          cp sing-box "$DIR_NAME"
          if [ -f libcronet.so ]; then
            cp libcronet.so "$DIR_NAME"
          fi
          tar -czvf "${DIR_NAME}.tar.gz" "$DIR_NAME"

      - name: 🧹 Cleanup
        run: |
          cd dist
          rm -rf "$DIR_NAME"
          rm -f openwrt.deb
          rm -f sing-box
          rm -f libcronet.so

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build_darwin:
    name: Darwin ${{ matrix.arch }}
    if: inputs.build == 'Binary' || github.event_name == 'schedule'
    needs: calculate_version
    runs-on: macos-latest
    timeout-minutes: 120
    environment: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }

    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.calculate_version.outputs.repo }}
          ref: ${{ needs.calculate_version.outputs.branch }}

      - name: 🔧 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 🔧 Set build tags
        run: |
          set -euo pipefail
          TAGS="${{ needs.calculate_version.outputs.base_tags }}"
          if [[ -z "${TAGS}" ]]; then
            TAGS=$(cat release/DEFAULT_BUILD_TAGS)
          fi
          EXTRA="${{ needs.calculate_version.outputs.extra_tags }}"
          if [[ -n "${EXTRA}" ]]; then
            IFS=',' read -ra ex <<< "$EXTRA"
            for t in "${ex[@]}"; do
              case ",${TAGS}," in *",${t},"*) ;; *) TAGS="${TAGS:+${TAGS},}${t}" ;; esac
            done
          fi
          echo "BUILD_TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "Build tags: ${TAGS}"

      - name: 🔧 Set shared ldflags
        run: |
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: 🔨 Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.profile }}" == "lean" ]]; then
            export CGO_ENABLED=0
          else
            export CGO_ENABLED=1
          fi
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "$BUILD_TAGS" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" \
          ./cmd/sing-box
          file dist/sing-box
          # 可复现构建：固定 mtime，使同一 commit 产物哈希稳定
          TZ=UTC touch -t '197001010000' dist/sing-box

      - name: 🔧 Set name
        run: |
          set -euo pipefail
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          ARTIFACT_NAME="binary_${{ matrix.os }}_${{ matrix.arch }}"
          echo "DIR_NAME=${DIR_NAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      - name: 🗜️ Archive
        run: |
          set -euo pipefail
          cd dist && mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME"
          cp sing-box "$DIR_NAME"
          tar -czvf "${DIR_NAME}.tar.gz" "$DIR_NAME"

      - name: 🧹 Cleanup
        run: |
          cd dist
          rm -rf "$DIR_NAME"
          rm -f sing-box

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build_windows:
    name: Windows ${{ matrix.arch }}
    if: inputs.build == 'Binary' || github.event_name == 'schedule'
    needs: calculate_version
    runs-on: windows-latest
    timeout-minutes: 120
    environment: build
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }

    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.calculate_version.outputs.repo }}
          ref: ${{ needs.calculate_version.outputs.branch }}

      - name: 🔧 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 📩 Clone cronet-go
        if: needs.calculate_version.outputs.use_naive == 'true'
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          # 跳过 /lib 目录（预编译产物），配合 blob:none 只拉必要对象
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: 🔧 Set build tags
        run: |
          set -euo pipefail
          TAGS="${{ needs.calculate_version.outputs.base_tags }}"
          if [[ -z "${TAGS}" ]]; then
            TAGS=$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)
          fi
          EXTRA="${{ needs.calculate_version.outputs.extra_tags }}"
          if [[ -n "${EXTRA}" ]]; then
            IFS=',' read -ra ex <<< "$EXTRA"
            for t in "${ex[@]}"; do
              case ",${TAGS}," in *",${t},"*) ;; *) TAGS="${TAGS:+${TAGS},}${t}" ;; esac
            done
          fi
          echo "BUILD_TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "Build tags: ${TAGS}"

      - name: 🔧 Set shared ldflags
        run: |
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: 🔨 Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box.exe -tags "$BUILD_TAGS" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" \
          ./cmd/sing-box
          TZ=UTC touch -t '197001010000' dist/sing-box.exe
          ls -l dist/

      - name: 🧩 Extract libcronet.dll
        if: needs.calculate_version.outputs.use_naive == 'true'
        env:
          CGO_ENABLED: "0"
        run: |
          cd ~/cronet-go
          go run -v ./cmd/build-naive extract-lib --target ${{ matrix.os }}/${{ matrix.arch }} -o "$GITHUB_WORKSPACE/dist"

      - name: 🔧 Set name
        run: |
          set -euo pipefail
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          ARTIFACT_NAME="binary_${{ matrix.os }}_${{ matrix.arch }}"
          echo "DIR_NAME=${DIR_NAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      - name: 🗜️ Archive
        run: |
          set -euo pipefail
          cd dist && mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME"
          cp sing-box.exe "$DIR_NAME"
          if [ -f libcronet.dll ]; then
            cp libcronet.dll "$DIR_NAME"
          fi
          tar -a -c -f "${DIR_NAME}.zip" "$DIR_NAME"

      - name: 🧹 Cleanup
        run: |
          cd dist
          rm -rf "$DIR_NAME"
          rm -f sing-box.exe
          rm -f libcronet.dll

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build_android:
    name: Android ${{ matrix.arch }}
    if: inputs.build == 'Binary' || github.event_name == 'schedule'
    needs: calculate_version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: android, arch: arm64, ndk: "aarch64-linux-android23" }
          - { os: android, arch: amd64, ndk: "x86_64-linux-android23" }

    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.calculate_version.outputs.repo }}
          ref: ${{ needs.calculate_version.outputs.branch }}

      - name: 🔧 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 🔧 Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: true

      - name: 🔧 Set build tags
        run: |
          set -euo pipefail
          TAGS="${{ needs.calculate_version.outputs.base_tags }}"
          if [[ -z "${TAGS}" ]]; then
            TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
          fi
          EXTRA="${{ needs.calculate_version.outputs.extra_tags }}"
          if [[ -n "${EXTRA}" ]]; then
            IFS=',' read -ra ex <<< "$EXTRA"
            for t in "${ex[@]}"; do
              case ",${TAGS}," in *",${t},"*) ;; *) TAGS="${TAGS:+${TAGS},}${t}" ;; esac
            done
          fi
          echo "BUILD_TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "Build tags: ${TAGS}"

      - name: 🔧 Set shared ldflags
        run: |
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: 🔨 Build
        env:
          CGO_ENABLED: "1"
          BUILD_GOOS: ${{ matrix.os }}
          BUILD_GOARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          go install -v ./cmd/internal/build
          export CC='${{ matrix.ndk }}-clang'
          export CXX="${CC}++"
          mkdir -p dist
          GOOS=$BUILD_GOOS GOARCH=$BUILD_GOARCH build go build -v -trimpath -o dist/sing-box -tags "$BUILD_TAGS" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" \
          ./cmd/sing-box
          TZ=UTC touch -t '197001010000' dist/sing-box

      - name: 🔧 Set name
        run: |
          set -euo pipefail
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          ARTIFACT_NAME="binary_${{ matrix.os }}_${{ matrix.arch }}"
          echo "DIR_NAME=${DIR_NAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      - name: 🗜️ Archive
        run: |
          set -euo pipefail
          cd dist && mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME"
          cp sing-box "$DIR_NAME"
          tar -czvf "${DIR_NAME}.tar.gz" "$DIR_NAME"

      - name: 🧹 Cleanup
        run: |
          cd dist
          rm -rf "$DIR_NAME"
          rm -f sing-box

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build_apps:
    name: Build Android APKs
    if: inputs.build == 'Apps' && github.event_name != 'schedule'
    needs: calculate_version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: build
    env:
      # 客户端仓库与分支必须与核心分支匹配：
      #   ref1nd-*  核心含 createAutoRedirectListener 等新接口，官方客户端未实现，会编译失败
      #   official-* 用官方客户端
      ANDROID_REPO: ${{ startsWith(inputs.target || 'ref1nd-testing', 'ref1nd') && 'reF1nd/sing-box-for-android' || 'SagerNet/sing-box-for-android' }}
      TARGET_BRANCH: ${{ startsWith(inputs.target || 'ref1nd-testing', 'ref1nd') && (contains(inputs.target || 'ref1nd-testing', 'testing') && 'reF1nd-testing' || 'reF1nd-stable') || (contains(inputs.target || 'ref1nd-testing', 'testing') && 'dev' || 'main') }}

    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.calculate_version.outputs.repo }}
          ref: ${{ needs.calculate_version.outputs.branch }}
          fetch-depth: 0
          submodules: 'recursive'

      - name: 🔧 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 🔧 Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: true

      - name: 🔧 Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: 🔨 Build library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android

      - name: 🔍 Checkout target branch
        run: |
          set -euo pipefail
          cd clients/android
          # .gitmodules 固定指向 SagerNet，ref1nd 目标需切换到 reF1nd 的客户端仓库
          if [[ "$ANDROID_REPO" == "SagerNet/sing-box-for-android" ]]; then
            REMOTE=origin
          else
            git remote add fork "https://github.com/${ANDROID_REPO}.git"
            REMOTE=fork
          fi
          git fetch --depth 1 "$REMOTE" "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" FETCH_HEAD
          echo "client: ${ANDROID_REPO}@${TARGET_BRANCH}"
          git log --oneline -1

      # clients/android 是外部 submodule，无法在本仓库内改文件，
      # 因此在 checkout 之后覆盖 release.keystore 并注入签名参数。
      # 两个 secret 都未配置时保留仓库自带的 keystore（仅调试用）。
      - name: 🔑 Inject signing material
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPS_B64: ${{ secrets.ANDROID_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64}" || -z "${PROPS_B64}" ]]; then
            echo "::error::需要同时配置 ANDROID_KEYSTORE_BASE64 与 ANDROID_LOCAL_PROPERTIES_BASE64"
            exit 1
          fi
          printf '%s' "${KEYSTORE_B64}" | base64 -d > clients/android/app/release.keystore
          printf '%s' "${PROPS_B64}" | base64 -d > clients/android/local.properties
          # JKS=feedfeed  PKCS12=3082（DER SEQUENCE）
          magic=$(od -An -tx1 -N2 clients/android/app/release.keystore | tr -d ' \n')
          [[ "$magic" == "feed" || "$magic" == "3082" ]] || { echo "::error::keystore 非 JKS/PKCS12（magic=$magic）"; exit 1; }
          for k in KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            grep -q "^$k=" clients/android/local.properties || { echo "::error::properties 缺少 $k"; exit 1; }
          done

      - name: 🧮 Update version
        run: |
          set -euo pipefail
          extra=()
          # nightly 由 target 决定：测试版走 nightly，稳定版走正式版号
          if [[ "${{ needs.calculate_version.outputs.nightly }}" == "true" ]]; then
            extra+=(--nightly)
          fi
          go run -v ./cmd/internal/update_android_version --ci "${extra[@]}"

      - name: 🔨 Build APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p clients/android/app/libs
          cp *.aar clients/android/app/libs
          cd clients/android
          ./gradlew --build-cache --parallel :app:assembleOtherRelease :app:assembleOtherLegacyRelease

      - name: 📤 Prepare upload
        run: |
          set -euo pipefail
          mkdir -p dist
          cp clients/android/app/build/outputs/apk/other/release/*.apk dist
          cp clients/android/app/build/outputs/apk/otherLegacy/release/*.apk dist
          VERSION_CODE=$(grep VERSION_CODE clients/android/version.properties | cut -d= -f2)
          VERSION_NAME=$(grep VERSION_NAME clients/android/version.properties | cut -d= -f2)
          cat > dist/SFA-version-metadata.json << EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}"
          }
          EOF
          cat dist/SFA-version-metadata.json

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary_android_apks
          path: dist
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish nightly
    # 仅定时任务发布：workflow_dispatch 的输入已达 10 个上限，无法再加开关
    if: github.event_name == 'schedule' && needs.calculate_version.outputs.nightly == 'true'
    needs: [calculate_version, build_linux, build_darwin, build_windows, build_android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: 📂 Unpack archives
        run: |
          set -euo pipefail
          cd dist
          ls -la
          # artifact 是 zip，里面才是真正的 tar.gz / ipk / deb
          for z in *.zip; do
            [ -e "$z" ] || continue
            # 直接解到当前目录，避免多一层子目录导致 gh release create 拿到目录
            unzip -o -q "$z" -d .
            rm -f "$z"
          done
          echo "--- flattened ---"
          find . -maxdepth 1 -type f | sort

      - name: 🏷️ Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.calculate_version.outputs.version }}
          BASE_TAGS: ${{ needs.calculate_version.outputs.base_tags }}
        run: |
          set -euo pipefail
          TAG="nightly-$(date -u +%Y%m%d)"
          # 同日重跑时先删旧 release 与 tag，避免 --clobber 残留陈旧资产
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true

          cat > notes.md <<EOF
          sing-box \`${VERSION}\`

          构建标签：
          \`\`\`
          ${BASE_TAGS}
          \`\`\`

          自动构建产物，未经过人工测试。仅保留最近若干期。
          EOF

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Nightly $(date -u +%Y-%m-%d) · ${VERSION}" \
            --notes-file notes.md \
            --prerelease \
            dist/*

      - name: 🧹 Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 只保留最近 8 期，避免 release 页无限增长
          gh release list --repo "${{ github.repository }}" \
            --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
          | { grep '^nightly-' || true; } | sort -r | tail -n +9 | while read -r tag; do
              echo "deleting $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            done
